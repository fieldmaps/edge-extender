[project]
name = "topo-tools"
version = "0.5.3"
description = "DuckDB-powered geospatial topology utilities (edge-matching, topology cleaning, more)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maxym Malynowsky", email = "maxym.malynowsky@un.org" }]
requires-python = ">=3.10"
dependencies = ["click", "duckdb>=1.5.5", "psutil", "pyyaml>=6.0.3"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Homepage = "https://github.com/OCHA-DAP/topo-tools-py"
Repository = "https://github.com/OCHA-DAP/topo-tools-py"
Issues = "https://github.com/OCHA-DAP/topo-tools-py/issues"

[project.scripts]
topo-tools = "topo_tools.cli.main:cli"

[dependency-groups]
dev = ["import-linter", "pre-commit", "pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
fix = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D203", "D213", "S603", "S607", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D103", "INP001", "S101"]
"packaging/*" = ["ANN", "D100", "D103", "INP001"]

[tool.importlinter]
root_package = "topo_tools"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "core-no-click"
name = "Core modules must not import Click"
type = "forbidden"
source_modules = ["topo_tools.core"]
forbidden_modules = ["click"]

[[tool.importlinter.contracts]]
id = "api-no-cli"
name = "API modules must not import CLI"
type = "forbidden"
source_modules = ["topo_tools.api"]
forbidden_modules = ["topo_tools.cli"]

[[tool.importlinter.contracts]]
id = "edge_match-may-use-edge_extend-not-reverse"
name = "edge_match may depend on edge_extend; edge_extend must not depend on edge_match"
type = "forbidden"
source_modules = ["topo_tools.core.edge_extend"]
forbidden_modules = ["topo_tools.core.edge_match"]

[[tool.importlinter.contracts]]
id = "change-independent-of-edge_extend"
name = "change and edge_extend must not depend on each other"
type = "independence"
modules = ["topo_tools.core.change", "topo_tools.core.edge_extend"]

[[tool.importlinter.contracts]]
id = "edge_mosaic-independent-of-edge_extend"
name = "edge_mosaic and edge_extend must not depend on each other"
type = "independence"
modules = ["topo_tools.core.edge_mosaic", "topo_tools.core.edge_extend"]

[[tool.importlinter.contracts]]
id = "edge_mosaic-independent-of-edge_match"
name = "edge_mosaic and edge_match must not depend on each other"
type = "independence"
modules = ["topo_tools.core.edge_mosaic", "topo_tools.core.edge_match"]

[[tool.importlinter.contracts]]
id = "core-constants-is-leaf"
name = "core.constants must not depend on any tool package"
type = "forbidden"
source_modules = ["topo_tools.core.constants"]
forbidden_modules = [
    "topo_tools.core.edge_extend",
    "topo_tools.core.edge_match",
    "topo_tools.core.topo_clean",
    "topo_tools.core.change",
    "topo_tools.core.edge_mosaic",
]

