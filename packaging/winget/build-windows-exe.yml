# Draft job, not yet wired into .github/workflows/publish.yml. See packaging/README.md.

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv venv
      - run: uv pip install . pyinstaller
      - run: uv run pyinstaller packaging/winget/topo-tools.spec --distpath dist --workpath build --noconfirm
      - run: Compress-Archive -Path dist/topo-tools -DestinationPath dist/topo-tools-windows.zip
      - uses: actions/upload-artifact@v7
        with:
          name: topo-tools-windows
          path: dist/topo-tools-windows.zip
