# Example target schema for schema-propose, covering the COD-AB fields
# described in hdx-cod-ab-ai's CLAUDE.md. adm{n}_name1/name2/name3
# (alternate-language names) are intentionally omitted: they don't vary by
# admin level the way adm{n}_name/adm{n}_pcode do, so this repo's
# cardinality/nesting-based level inference doesn't apply to them. Add
# them as your own non-repeatable fields (e.g. name: adm2_name1) once you
# know which source column holds which language.
fields:
  - name: adm{n}_name
    repeatable: { min: 0, max: 5 }
    aliases: ["name", "nom", "nombre", "nome", "label", "title"]
    patterns: ["^adm[0-9]?_?name$", ".*_name$", "^name_.*"]
  - name: adm{n}_pcode
    repeatable: { min: 0, max: 5 }
    aliases: ["pcode", "p_code"]
    patterns: ["^adm[0-9]?_?pcode$", "pcode$"]
  - name: iso2
    aliases: ["iso2", "iso_a2"]
  - name: iso3
    aliases: ["iso3", "iso_a3"]
  - name: valid_on
    aliases: ["valid_on", "date", "release_date"]
  - name: valid_to
    aliases: ["valid_to", "expiry_date"]
  - name: area_sqkm
    aliases: ["area_sqkm", "area_km2"]
  - name: version
    aliases: ["version"]
  - name: lang
    aliases: ["lang", "language"]
